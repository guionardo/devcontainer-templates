[PHP]

; Compatibility profile for the legacy application on the PHP 5.1.6 container.
engine = On
short_open_tag = On
asp_tags = Off
precision = 14
y2k_compliance = On

output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = 100
allow_call_time_pass_reference = On

safe_mode = Off
expose_php = On
max_execution_time = 3600
max_input_time = 60
memory_limit = 1536M

error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
error_log = /var/log/apache2/phperrors

variables_order = "EGPCS"
register_globals = Off
register_long_arrays = On
register_argc_argv = On
auto_globals_jit = On

post_max_size = 8M
upload_max_filesize = 32M
upload_tmp_dir = /tmp
file_uploads = On

magic_quotes_gpc = On
magic_quotes_runtime = Off
magic_quotes_sybase = Off

default_mimetype = "text/html"
include_path = ".:/usr/share/pear:/usr/share/php"
extension_dir = "/usr/local/lib/php/extensions/no-debug-non-zts-20050922"
enable_dl = On

allow_url_fopen = Off
allow_url_include = Off
default_socket_timeout = 60

SMTP = localhost
smtp_port = 25
sendmail_path = "/usr/sbin/sendmail -t -i"

date.timezone = "America/Sao_Paulo"

session.save_handler = files
session.save_path = "/var/lib/php/session"
session.use_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.serialize_handler = php
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.cache_limiter = nocache
session.cache_expire = 180
session.use_trans_sid = 0

; Xdebug 2.0.0 is the compatible extension for PHP 5.1.6.
zend_extension=/usr/local/lib/php/extensions/no-debug-non-zts-20050922/xdebug.so
xdebug.remote_enable=1
xdebug.remote_autostart=0
xdebug.remote_connect_back=0
xdebug.remote_host=host.docker.internal
xdebug.remote_port=9000

; APC intentionally disabled: no apc_* calls were found in the application.
; extension=apc.so
; apc.enabled = 0
