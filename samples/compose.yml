services:
  mariadb:
    image: mariadb:11.4.2
    container_name: mariadb_server
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: prd_mb_01
      MARIADB_USER: user
      MARIADB_PASSWORD: user
      TZ: America/Sao_Paulo
    volumes:
      - ./mariadb/11.4.2:/var/lib/mysql
      - ./bkp-srv-prd-mariadb-01-mysql-prd_mb_01-Thu-19:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:5.7.17
    container_name: mysql_server
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prd_mb_01
      MYSQL_USER: user
      MYSQL_PASSWORD: user
      TZ: America/Sao_Paulo
    volumes:
      - ./mariadb/5.7:/var/lib/mysql
      - ./bkp-srv-prd-mariadb-01-mysql-prd_mb_01-Thu-19:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  php_54:
    build:
      context: .
      dockerfile: Dockerfile.php54
    ports:
      - "8054:80"
    volumes:
      - ./project:/var/www/html


  php_85:
    build:
      context: .
      dockerfile: Dockerfile.php85
    ports:
      - "8085:80"
    volumes:
      - ./project:/var/www/html
      - ./logs/8.5:/var/log/apache2

  php_516:
    build:
      context: .
      dockerfile: Dockerfile.php516
    ports:
      - "8051:80"
    volumes:
      - ./project:/var/www/html
      - ./php.516.ini:/usr/local/lib/php.ini:ro
      - ./logs/5.1.6:/var/log/apache2
